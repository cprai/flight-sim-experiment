[package]
name = "terrain-process"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
# The one dependency with real weight in it, taken rather than hand-rolled:
# .osm.pbf is protobuf framing around zlib blocks around delta-coded columns,
# and a subtle misread would move geometry rather than fail.
osmpbf = "0.3.8"
rayon = "1.11.0"
# For `osm/source.json`, the record the downloader leaves beside the extract.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "project" carries the proj4rs conversions that put OSM's longitudes and
# latitudes onto the tile grid's metres.
terrain-tiles = { path = "../terrain-tiles", features = ["project"] }
