[package]
name = "terrain-tiles"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
# Optional: only the tools that project coordinates need it. The renderer
# depends on this crate too and never converts a CRS, so the `project` feature
# keeps proj4rs out of its build.
proj4rs = { version = "0.1.10", default-features = false, features = [
    "crs-definitions",
    "multi-thread",
], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = { version = "0.11", default-features = false, features = ["deflate"] }

[features]
# Coordinate conversion between the tile grid's CRS and the sources'; see
# `src/project.rs`. Off by default so the renderer does not link proj4rs.
project = ["dep:proj4rs"]
