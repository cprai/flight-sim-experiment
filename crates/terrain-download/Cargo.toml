[package]
name = "terrain-download"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-tiff = { version = "0.3", default-features = false, features = ["reqwest"] }
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11.11"
# Only the stream combinators, to keep several range requests in flight at once.
futures = { version = "0.3.31", default-features = false, features = ["std"] }
log = "0.4.33"
# Geofabrik publishes an .md5 beside every extract; hashing the assembled file
# is what proves a download resumed across runs is exactly one publication.
md5 = "0.8.1"
rayon = "1.11.0"
# Default features carry rustls, so there is no system OpenSSL to find. Left on
# rather than pinned to a TLS backend, so async-tiff's own reqwest dependency
# unifies with this one instead of building a second stack.
# "stream" is for the Geofabrik extract, which is far too large for `bytes()`.
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "project" carries the proj4rs-backed CRS conversions this tool projects its
# boxes and blocks through; the module lived here before terrain-process
# needed it too.
terrain-tiles = { path = "../terrain-tiles", features = ["project"] }
tiff = { version = "0.11", default-features = false, features = ["deflate"] }
# "time" is for the backoff between retries; see `retry`. "fs" and "io-util"
# stream the Geofabrik extract to disk without holding it in memory.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }

[dev-dependencies]
# Only so `retry`'s tests can build real error responses, and classify the
# error type reqwest actually produces rather than a mock of it.
http = "1"
# "test-util" lets `retry`'s tests advance the clock instead of sleeping
# through the backoff, which is otherwise the whole runtime of the suite.
tokio = { version = "1", features = ["test-util"] }
