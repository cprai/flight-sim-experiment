[package]
name = "terrain-generate"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# The channels cross to the GPU as plain bytes and come back the same way.
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
# wgpu's device request and buffer mapping are async and nothing here is; this
# is the same block-on the renderer's headless modes use.
pollster = "1.0.1"
# Every stage but the droplets is per-cell or per-tile work over tens of
# millions of cells, and the machine this was written on has 24 of them.
rayon = "1.12.0"
# The erosion runs as compute shaders. Pinned to the version the renderer uses:
# these passes are meant to be lifted into it later and run on its device, and
# two wgpu versions in one workspace would make that a port rather than a move.
wgpu = "30.0.1"
# How tall the trees on a texel stand, and how much of it they hide. Both
# answers come from one call, so the crowns folded into the elevation and the
# canopy id written into the ground cover cannot disagree about a texel.
terrain-canopy = { path = "../terrain-canopy" }
terrain-materials = { path = "../terrain-materials" }
# The same bargain as the canopy, for stone: how high the boulders and rubble on
# a texel stand, and how much of it they hide. One call answers both, so the
# stones folded into the elevation and the ids written into the ground cover
# cannot disagree about a texel.
terrain-rocks = { path = "../terrain-rocks" }
# Without "project": nothing here converts coordinates. The generator invents
# ground on the tile grid's own metres rather than reprojecting a source onto
# them, so proj4rs would be dead weight.
terrain-tiles = { path = "../terrain-tiles" }
